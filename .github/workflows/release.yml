name: Automasi Build APK SakuMe

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          VERSION_CODE=$(echo $VERSION | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Versi: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update version in build.gradle.kts
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ env.VERSION_NAME }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ env.VERSION_CODE }}/" app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SakuMe-v${{ env.VERSION_NAME }}.apk
          ls -lh release/

      - name: Extract changelog
        run: |
          VERSION="${{ env.VERSION_NAME }}"
          echo "Mencari changelog versi: $VERSION"

          if [ -f CHANGELOG.md ]; then
            sed -n "/## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          else
            echo "CHANGELOG.md tidak ditemukan" > release_notes.md
          fi

          if [ ! -s release_notes.md ]; then
            echo "### Changes" > release_notes.md
            echo "- Release v$VERSION" >> release_notes.md
          fi

          echo "===== Release Notes ====="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SakuMe v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: release/SakuMe-v${{ env.VERSION_NAME }}.apk